/* A4 landscape flyer: shared university identity, wide abstract and event details. */
.paper.a4.landscape{width:297mm;min-height:210mm;padding:10mm}
.landscape .band{padding:6mm 8mm}
.landscape .band .meta{font-size:10pt;margin-bottom:3mm}

.landscape .band .speaker{font-size:13pt;margin-top:3mm}
.landscape .paper-body{padding:7mm 8mm}
.seminar-layout{display:grid;grid-template-columns:minmax(0,1fr) 61mm;gap:9mm;align-items:start}
.seminar-abstract p{font-size:12pt;line-height:1.75}

.seminar-facts h2{font-size:13pt;margin-bottom:5mm}
.seminar-facts dl{margin:0;font-size:11pt;line-height:1.6}
.seminar-facts dt{font-weight:700;color:var(--gnu-action);margin-top:4mm}
.seminar-facts dt:first-child{margin-top:0}
.seminar-facts dd{margin:1mm 0 0;overflow-wrap:anywhere}
.landscape .references{font-size:9pt!important;margin-top:5mm}
.landscape .paper-footer{padding:4mm 8mm;align-items:center}
.landscape .paper-footer .organization{font-size:10pt}
.landscape .paper-footer .small{font-size:9pt}

.landscape .details{grid-template-columns:18mm 1fr 18mm 1fr;font-size:13pt;gap:4mm}

/* GNU VI subpage reference: header, breadcrumb strip, title, section menu and rows. */
.site-wrap{max-width:1565px}
.site .header-row{min-height:112px;display:flex;flex-direction:row;align-items:center;padding:20px 24px;gap:32px}

.site .menu-toggle{display:none}
.site-banner{height:136px;background-position:center;background-size:cover;display:flex;align-items:end}
.site-banner.no-photo{height:auto;background:var(--gnu-grey)}
.breadcrumb-bar{width:100%;background:rgba(0,0,0,.84);color:#fff}

.breadcrumb-bar li{min-width:0;display:flex;align-items:center;min-height:56px;border-right:1px solid rgba(255,255,255,.24);padding:10px 24px;overflow-wrap:anywhere}
.breadcrumb-bar li:first-child{border-left:1px solid rgba(255,255,255,.24)}
.breadcrumb-bar li:last-child{flex:1}
.site .breadcrumb-bar a{color:#fff;text-decoration:none;padding:0}
.page-heading{display:flex;justify-content:space-between;align-items:start;gap:24px;margin:44px 0 42px}
.site .page-heading h1{font-family:'SUITE',var(--gnu-font);font-size:33px;font-weight:800;margin:0;overflow-wrap:anywhere;min-width:0}
.page-tools{flex-shrink:0}
.site .page-tools button{min-height:44px;border:1px solid #d7d7d7;background:#f4f5f6;padding:8px 18px;border-radius:2px}
.site .section-menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 58px}
.site .section-menu a{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:16px 20px;border:2px solid #d7d7d7;color:#555;text-decoration:none;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.site .section-menu a::after{content:'↓';font-size:20px;margin-left:16px}
.site .section-menu a[aria-current]{color:#fff;background:linear-gradient(90deg,#0069b4,#005a9c);border-color:#0069b4}
.site .content-row{display:grid;grid-template-columns:165px minmax(0,1fr);gap:36px;margin-bottom:44px;scroll-margin-top:24px}
.site .content-row h2{border:0;padding:0;margin:0;font-family:'SUITE',var(--gnu-font);font-size:24px;line-height:1.4}
.site .row-body{min-width:0}
.site .row-body p:last-child{margin-bottom:0}
.site .row-body ul{margin:0;padding-left:22px}
.site .row-body table{border-top:2px solid var(--gnu-grey)}
.table-scroll:focus-visible{outline:3px solid var(--gnu-action);outline-offset:4px}
@media(max-width:800px){

 .site .web-logo{width:220px}
 .site .menu-toggle{display:block;margin-left:auto;min-height:44px;padding:8px 10px}
 .site .site-nav{display:none;width:100%;gap:12px;flex-wrap:wrap;border-top:1px solid #ddd;padding-top:12px}
 .site .site-nav[data-open="true"]{display:flex}
 .site .site-nav a{font-size:17px;padding:8px 10px}
 .site-banner{height:114px}
 .breadcrumb-bar li{font-size:14px;min-height:48px;padding:10px 12px}
 .breadcrumb-bar li:nth-child(2){display:none}
 .page-heading{margin:30px 0;gap:14px}
 .site .page-heading h1{font-size:28px}
 .site .section-menu{grid-template-columns:1fr;margin-bottom:36px;gap:6px}
 .site .section-menu a{min-height:52px;padding:12px 16px}
 .site .content-row{grid-template-columns:1fr;gap:14px;margin-bottom:36px}
 .site .content-row h2{font-size:22px}
}
@media print{
 .site .header-row{min-height:64px;padding:8px 0}
 .site .web-logo{width:220px}
 .site .site-nav,.site .menu-toggle,.site-banner,.site .section-menu,.page-tools{display:none!important}
 .site .page-heading{margin:20px 0 24px}

 .site .content-row h2{font-size:19px;break-after:auto}

}
.site .breadcrumb-bar{display:block}
.site .breadcrumb-bar a{font-weight:400}
.site .row-body{color:#555}
.site .row-body table{color:#222}
@media(max-width:800px){.site .web-logo{width:200px}}

/* Separate official slogan and university signature; extra art is opt-in. */
