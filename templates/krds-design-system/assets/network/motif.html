<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Motif</title>
<style>
  :root { --gnu-blue: #009edb; --edge: #131416; --bg: #ffffff; --muted: #6d7882; }
  @media (prefers-color-scheme: dark) { :root { --edge: #f4f5f6; --bg: #0a0c0d; --muted: #8a949e; } }
  html, body { margin: 0; background: var(--bg); color: var(--edge);
    font: 400 15px/1.5 'Pretendard GOV', 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  figure { margin: 0; width: min(560px, 100%); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .e { stroke: var(--edge); stroke-width: 4; stroke-linecap: round; transition: stroke .2s, stroke-width .2s; }
  .n { fill: var(--gnu-blue); transition: transform .2s; transform-box: fill-box; transform-origin: center; cursor: pointer; }
  .n:hover, .n:focus-visible { transform: scale(1.18); outline: none; }
  .e.on { stroke: var(--gnu-blue); stroke-width: 6; }
  figcaption { margin-top: 12px; color: var(--muted); font-size: 13px; text-align: center; }
  @media (prefers-reduced-motion: no-preference) {
    .n { animation: breathe 4s ease-in-out infinite; animation-delay: calc(var(--i) * -0.4s); }
    @keyframes breathe { 50% { transform: scale(1.06); } }
  }
</style>
</head>
<body>
<main>
<figure>
<svg viewBox="-1.1 -17.2 528.9 426.4" role="img" aria-label="Network Science Lab mark: 10 nodes, 7 edges">
<line class="e" data-ends="0 4" x1="195.0" y1="25.3" x2="160.8" y2="247.1"/>
<line class="e" data-ends="0 9" x1="195.0" y1="25.3" x2="365.7" y2="366.7"/>
<line class="e" data-ends="1 5" x1="297.5" y1="110.6" x2="41.4" y2="247.2"/>
<line class="e" data-ends="2 3" x1="126.8" y1="144.7" x2="382.7" y2="196.0"/>
<line class="e" data-ends="3 6" x1="382.7" y1="196.0" x2="263.5" y2="247.3"/>
<line class="e" data-ends="6 7" x1="263.5" y1="247.3" x2="485.3" y2="247.3"/>
<line class="e" data-ends="6 8" x1="263.5" y1="247.3" x2="195.0" y2="349.6"/>
<circle class="n" tabindex="0" data-id="0" style="--i:0" cx="195.0" cy="25.3" r="18.5"/>
<circle class="n" tabindex="0" data-id="1" style="--i:1" cx="297.5" cy="110.6" r="18.5"/>
<circle class="n" tabindex="0" data-id="2" style="--i:2" cx="126.8" cy="144.7" r="18.5"/>
<circle class="n" tabindex="0" data-id="3" style="--i:3" cx="382.7" cy="196.0" r="18.5"/>
<circle class="n" tabindex="0" data-id="4" style="--i:4" cx="160.8" cy="247.1" r="18.5"/>
<circle class="n" tabindex="0" data-id="5" style="--i:5" cx="41.4" cy="247.2" r="18.5"/>
<circle class="n" tabindex="0" data-id="6" style="--i:6" cx="263.5" cy="247.3" r="18.5"/>
<circle class="n" tabindex="0" data-id="7" style="--i:7" cx="485.3" cy="247.3" r="18.5"/>
<circle class="n" tabindex="0" data-id="8" style="--i:8" cx="195.0" cy="349.6" r="18.5"/>
<circle class="n" tabindex="0" data-id="9" style="--i:9" cx="365.7" cy="366.7" r="18.5"/>
</svg>
<figcaption>GNU Blue #009EDB 노드 · 검정 엣지 — 노드에 마우스를 올리면 연결된 엣지가 표시됨</figcaption>
</figure>
</main>
<script>
  const edges = [...document.querySelectorAll('.e')];
  document.querySelectorAll('.n').forEach(n => {
    const on = v => edges.forEach(e => e.classList.toggle('on', v && e.dataset.ends.split(' ').includes(n.dataset.id)));
    ['mouseenter', 'focus'].forEach(t => n.addEventListener(t, () => on(true)));
    ['mouseleave', 'blur'].forEach(t => n.addEventListener(t, () => on(false)));
  });
</script>
</body>
</html>
